name: lifeos
description: Local-First Household & Life Management System
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database (SQLCipher = SQLite + page-level AES-256 encryption)
  drift: ^2.22.1
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.4.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Barcode Scanning
  mobile_scanner: ^6.0.4

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # File & Storage
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  image: ^4.2.0

  # Networking (OpenFoodFacts API + local sync server)
  http: ^1.2.2
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # Utilities
  intl: ^0.20.2
  gap: ^3.0.1
  crypto: ^3.0.6
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  archive: ^3.6.1
  share_plus: ^12.0.1

  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.0.0
  cryptography: ^2.9.0
  local_auth: ^2.3.0

  # Auto-sizing text (scales down font when constrained)
  auto_size_text: ^3.0.0

  # Charts (Health: Gewichtsverlauf, Makros, Workout-Statistiken)
  fl_chart: ^0.69.0

  # OCR (MHD-Scan via Kamera)
  google_mlkit_text_recognition: ^0.14.0

  # Audio (Workout-Timer Beep-Cues)
  audioplayers: ^6.4.0
  home_widget: ^0.9.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true  # enables l10n ARB code generation

  assets:
    - assets/

flutter_gen:
  output: lib/gen/
