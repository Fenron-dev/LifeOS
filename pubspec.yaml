name: lifeos
description: Local-First Household & Life Management System
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Barcode Scanning
  mobile_scanner: ^6.0.4

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # File & Storage
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  image: ^4.2.0

  # Networking (OpenFoodFacts API + local sync server)
  http: ^1.2.2
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # Utilities
  intl: ^0.20.2
  gap: ^3.0.1
  crypto: ^3.0.6
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  archive: ^3.6.1
  share_plus: ^12.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true  # enables l10n ARB code generation

  assets:
    - assets/

flutter_gen:
  output: lib/gen/
